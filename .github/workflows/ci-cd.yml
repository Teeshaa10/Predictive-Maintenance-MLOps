name: Predictive Maintenance CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check application imports
        run: |
          python -c "import app; print('FastAPI import successful')"

      - name: Verify trained model
        run: |
          python -c "import joblib; b=joblib.load('models/maintenance_bundle.joblib'); print('Model loaded:', b['best_classifier'])"

      - name: Build Docker image
        run: |
          docker build -t predictive-maintenance:ci .

